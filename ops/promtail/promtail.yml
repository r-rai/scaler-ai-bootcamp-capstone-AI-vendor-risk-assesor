server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /positions/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: vendor-risk-app
    static_configs:
      - targets: [localhost]
        labels:
          job: vendor-risk-app
          __path__: /data/runs/logs/*.jsonl
    pipeline_stages:
      - json:
          expressions: {level: level, logger: logger, ts: ts}
      - labels: {level: "", logger: ""}
      - timestamp: {source: ts, format: RFC3339Nano}
