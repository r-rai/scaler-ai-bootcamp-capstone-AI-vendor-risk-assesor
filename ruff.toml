# Correctness rules only: syntax errors, undefined names, invalid comparisons, redefinitions.
# Style and unused-code rules are deliberately off (they would need edits to the frozen tests and gold-set tooling).
target-version = "py311"
extend-exclude = ["models", "runs", ".venv"]

[lint]
select = ["E9", "F63", "F7", "F82", "F811"]
